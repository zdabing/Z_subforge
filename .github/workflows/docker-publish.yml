name: 构建并推送 Docker 镜像 (Docker Hub)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: # 手动触发

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # Secrets 值可能带换行/首尾空白（粘贴带入），会导致 tags 被拆行成非法镜像名，
      # 这里统一提取并去除所有空白，后续 login 与 tag 均用它；为空则直接报错中止。
      - name: 提取并校验 Docker Hub 用户名
        id: dockerhub
        run: |
          USER="$(echo "${{ secrets.DOCKERHUB_USERNAME }}" | tr -d '[:space:]')"
          echo "user=${USER}" >> "$GITHUB_OUTPUT"
          if [ -z "$USER" ]; then
            echo "::error::DOCKERHUB_USERNAME 未配置或为空。请在仓库 Settings → Secrets and variables → Actions 添加后重跑。"
            exit 1
          fi

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ steps.dockerhub.outputs.user }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # x86_64 架构（NAS/服务器常见）
          platforms: linux/amd64
          tags: |
            ${{ steps.dockerhub.outputs.user }}/subforge:latest
            ${{ steps.dockerhub.outputs.user }}/subforge:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
