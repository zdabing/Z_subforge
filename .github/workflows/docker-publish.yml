name: 构建并推送 Docker 镜像 (Docker Hub)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: # 手动触发

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 校验 Docker Hub 密钥已配置
        if: ${{ secrets.DOCKERHUB_USERNAME == '' || secrets.DOCKERHUB_TOKEN == '' }}
        run: |
          echo "::error::未配置 Docker Hub 密钥。请先在仓库 Settings → Secrets and variables → Actions 添加 DOCKERHUB_USERNAME（Docker Hub 用户名）和 DOCKERHUB_TOKEN（Access Token），然后重新触发本工作流。"
          exit 1

      - name: 设置 QEMU（多架构支持，NAS 常见 arm64 可拉取）
        uses: docker/setup-qemu-action@v3

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 多架构：NAS 的 x86_64 / arm64 / armv7 都能拉
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/subforge:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/subforge:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
