# subforge 订阅配置生成服务
# 使用：docker compose up -d
services:
  subforge:
    image: wzbsdb/subforge:latest
    container_name: subforge
    restart: unless-stopped
    ports:
      - "8790:8790"
    volumes:
      # 配置、快照、生成的 YAML 都持久化在这里，升级镜像不丢数据
      - ./subforge-data:/data
    environment:
      - HOST=0.0.0.0
      - PORT=8790
      - DATA_DIR=/data
      - TZ=Asia/Shanghai
      # 可选：客户端显示的订阅名称（不设则按订阅域名自动推断）
      # - SUB_TITLE=MyAirport
